<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - ID Generator</title>

<!-- QR CODE LIBRARY -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0b5ed7;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}

input,
select{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    font-size:18px;
    background:#0b5ed7;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

#generated{

    margin-top:25px;

    padding:20px;

    background:#e8f5e9;

    border:1px solid #28a745;

    border-radius:8px;

    display:none;

}

#verificationID{

    font-size:24px;

    font-weight:bold;

    color:#198754;

    text-align:center;

    margin-top:10px;

    margin-bottom:20px;

    word-break:break-word;

}

#verificationLink{

    background:white;

}

#qrcode{

    margin:20px auto;

    width:220px;

    min-height:220px;

    display:flex;

    justify-content:center;

    align-items:center;

    background:white;

    padding:10px;

    border-radius:5px;

}

#record{

    text-align:left;

    background:#f5f5f5;

    padding:15px;

    overflow:auto;

    white-space:pre-wrap;

    word-break:break-word;

}

.success{

    color:#198754;

    font-weight:bold;

    text-align:center;

}

.small-text{

    font-size:13px;

    color:#555;

    text-align:center;

}

.error{

    color:#dc3545;

    font-weight:bold;

    text-align:center;

    margin-top:15px;

}

.loading{

    color:#0b5ed7;

    font-weight:bold;

    text-align:center;

    margin-top:15px;

}


/* MOBILE */

@media(max-width:600px){

    .container{

        margin:15px;

        padding:20px;

    }

    h1{

        font-size:27px;

    }

    #verificationID{

        font-size:21px;

    }

    #qrcode{

        width:210px;

        min-height:210px;

    }

}

</style>

</head>


<body>


<div class="container">


<h1>
PATEL ASSOCIATES
</h1>


<h2>
Verification ID Generator
</h2>


<!-- OWNER NAME -->

<label>
Owner Name
</label>

<input
    type="text"
    id="ownerName"
    placeholder="Enter Owner Name"
>


<!-- OWNER ADDRESS -->

<label>
Owner Address
</label>

<input
    type="text"
    id="ownerAddress"
    placeholder="Enter Owner Address"
>


<!-- REPORT TYPE -->

<label>
Report Type
</label>

<select id="reportType">

    <option value="">
        Select Report Type
    </option>

    <option value="Floor Plan">
        Floor Plan
    </option>

    <option value="Estimate">
        Estimate
    </option>

    <option value="Location Map">
        Location Map
    </option>

    <option value="Key Plan">
        Key Plan
    </option>

    <option value="Report">
        Report
    </option>

</select>


<!-- ISSUE DATE -->

<label>
Issue Date
</label>

<input
    type="date"
    id="issueDate"
>


<!-- ERROR / STATUS -->

<div id="message"></div>


<!-- GENERATE BUTTON -->

<button onclick="generateID()">

    🔐 Generate Verification ID

</button>


<!-- GENERATED RESULT -->

<div id="generated">


    <h3 class="success">

        ✅ Verification ID Generated

    </h3>


    <!-- VERIFICATION ID -->

    <h3>
        Verification ID
    </h3>


    <div id="verificationID"></div>


    <button onclick="copyID()">

        📋 Copy Verification ID

    </button>


    <!-- VERIFICATION LINK -->

    <h3>
        🔗 Verification Link
    </h3>


    <input
        type="text"
        id="verificationLink"
        readonly
    >


    <button onclick="copyLink()">

        📋 Copy Verification Link

    </button>


    <!-- QR CODE -->

    <h3 style="text-align:center;">

        📱 QR Code

    </h3>


    <div id="qrcode"></div>


    <button onclick="downloadQR()">

        ⬇️ Download QR Code

    </button>


    <!-- COMPLETE RECORD -->

    <h3>
        📄 Complete Record
    </h3>


    <pre id="record"></pre>


    <button onclick="copyRecord()">

        📋 Copy Record

    </button>


    <p class="small-text">

        यह Record data.json में manually add करने के लिए तैयार है।

    </p>


</div>


</div>


<script>


/* ==================================================
   GENERATE UNIQUE RANDOM VERIFICATION ID
================================================== */

async function generateID(){


    /* ==========================================
       GET FORM DATA
    ========================================== */

    let ownerName =
        document.getElementById(
            "ownerName"
        ).value.trim();


    let ownerAddress =
        document.getElementById(
            "ownerAddress"
        ).value.trim();


    let reportType =
        document.getElementById(
            "reportType"
        ).value;


    let issueDate =
        document.getElementById(
            "issueDate"
        ).value;


    /* ==========================================
       CHECK ALL FIELDS
    ========================================== */

    if(
        ownerName === "" ||
        ownerAddress === "" ||
        reportType === "" ||
        issueDate === ""
    ){

        alert(
            "कृपया सभी जानकारी भरें।"
        );

        return;

    }


    /* ==========================================
       SHOW LOADING
    ========================================== */

    let message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        '<div class="loading">🔄 Existing IDs check की जा रही हैं...</div>';


    document.getElementById(
        "generated"
    ).style.display = "none";


    /* ==========================================
       LOAD EXISTING DATA.JSON
    ========================================== */

    let existingIDs = [];


    try{


        let response =
            await fetch(
                "data.json?v=" +
                Date.now()
            );


        if(response.ok){


            let data =
                await response.json();


            /*
               Normal data.json format:

               [
                 {
                   "id":"PA-XXXX-XXXX"
                 }
               ]
            */


            if(Array.isArray(data)){


                existingIDs =
                    data

                    .map(function(item){

                        return String(
                            item.id || ""
                        ).trim().toUpperCase();

                    })

                    .filter(function(id){

                        return id !== "";

                    });

            }


        }


    }

    catch(error){


        console.error(
            "data.json check error:",
            error
        );


        message.innerHTML =
            '<div class="error">⚠️ data.json load नहीं हो सकी।</div>';


        return;

    }


    /* ==========================================
       CHARACTERS FOR RANDOM ID
    ========================================== */

    let characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    /* ==========================================
       CREATE UNIQUE ID
    ========================================== */

    let finalID = "";

    let duplicate = true;


    /*
       Maximum attempts

       ताकि किसी unexpected problem में
       browser infinite loop में न जाए।
    */

    let attempts = 0;

    let maxAttempts = 1000;


    while(
        duplicate &&
        attempts < maxAttempts
    ){


        attempts++;


        let part1 = "";

        let part2 = "";


        /* ======================================
           FIRST 4 RANDOM CHARACTERS
        ====================================== */

        for(
            let i = 0;
            i < 4;
            i++
        ){

            part1 +=
                characters.charAt(

                    Math.floor(
                        Math.random() *
                        characters.length
                    )

                );

        }


        /* ======================================
           SECOND 4 RANDOM CHARACTERS
        ====================================== */

        for(
            let i = 0;
            i < 4;
            i++
        ){

            part2 +=
                characters.charAt(

                    Math.floor(
                        Math.random() *
                        characters.length
                    )

                );

        }


        /* ======================================
           FINAL ID
        ====================================== */

        finalID =
            "PA-" +
            part1 +
            "-" +
            part2;


        /* ======================================
           CHECK DUPLICATE
        ====================================== */

        duplicate =
            existingIDs.includes(
                finalID.toUpperCase()
            );


    }


    /* ==========================================
       IF UNIQUE ID NOT FOUND
    ========================================== */

    if(
        duplicate
    ){

        message.innerHTML =
            '<div class="error">❌ Unique ID generate नहीं हो सकी। कृपया फिर से कोशिश करें।</div>';

        return;

    }


    /* ==========================================
       CREATE VERIFICATION LINK
    ========================================== */

    let verificationPath =
        window.location.pathname
            .replace(
                "admin.html",
                "verify.html"
            );


    let verificationLink =
        window.location.origin +
        verificationPath +
        "?id=" +
        encodeURIComponent(
            finalID
        );


    /* ==========================================
       CREATE RECORD
    ========================================== */

    let record = {

        id:
            finalID,

        ownerName:
            ownerName,

        ownerAddress:
            ownerAddress,

        reportType:
            reportType,

        issueDate:
            issueDate,

        status:
            "VERIFIED"

    };


    /* ==========================================
       SHOW VERIFICATION ID
    ========================================== */

    document.getElementById(
        "verificationID"
    ).innerText =
        finalID;


    /* ==========================================
       SHOW VERIFICATION LINK
    ========================================== */

    document.getElementById(
        "verificationLink"
    ).value =
        verificationLink;


    /* ==========================================
       SHOW COMPLETE RECORD
    ========================================== */

    document.getElementById(
        "record"
    ).innerText =
        JSON.stringify(
            record,
            null,
            2
        );


    /* ==========================================
       CLEAR OLD QR CODE
    ========================================== */

    document.getElementById(
        "qrcode"
    ).innerHTML =
        "";


    /* ==========================================
       CREATE QR CODE
    ========================================== */

    new QRCode(

        document.getElementById(
            "qrcode"
        ),

        {

            text:
                verificationLink,

            width:
                200,

            height:
                200

        }

    );


    /* ==========================================
       SHOW RESULT
    ========================================== */

    document.getElementById(
        "generated"
    ).style.display =
        "block";


    /* ==========================================
       CLEAR MESSAGE
    ========================================== */

    message.innerHTML =
        '<div class="success">✅ Unique ID successfully generated.</div>';

}


/* ==================================================
   COPY VERIFICATION ID
================================================== */

function copyID(){


    let id =
        document.getElementById(
            "verificationID"
        ).innerText;


    navigator.clipboard.writeText(
        id
    );


    alert(
        "Verification ID copied: " +
        id
    );

}


/* ==================================================
   COPY VERIFICATION LINK
================================================== */

function copyLink(){


    let link =
        document.getElementById(
            "verificationLink"
        ).value;


    navigator.clipboard.writeText(
        link
    );


    alert(
        "Verification Link copied."
    );

}


/* ==================================================
   COPY COMPLETE RECORD
================================================== */

function copyRecord(){


    let record =
        document.getElementById(
            "record"
        ).innerText;


    navigator.clipboard.writeText(
        record
    );


    alert(
        "Complete record copied."
    );

}


/* ==================================================
   DOWNLOAD QR CODE
================================================== */

function downloadQR(){


    let qrImage =
        document.querySelector(
            "#qrcode img"
        );


    if(!qrImage){


        alert(
            "पहले Verification ID Generate करें।"
        );


        return;

    }


    let downloadLink =
        document.createElement(
            "a"
        );


    downloadLink.href =
        qrImage.src;


    downloadLink.download =
        "PATEL-ASSOCIATES-" +

        document.getElementById(
            "verificationID"
        ).innerText +

        ".png";


    downloadLink.click();

}

</script>


</body>

</html>
