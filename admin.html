<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Verification Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0b5ed7;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    margin-top:7px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    font-size:17px;
    background:#0b5ed7;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

/* ESTIMATE AMOUNT */

#estimateAmountBox{
    display:none;
    margin-top:5px;
}

.amount-note{
    font-size:13px;
    color:#666;
    margin-top:5px;
}

#generated{
    display:none;
    margin-top:25px;
    padding:20px;
    background:#e8f5e9;
    border:1px solid #28a745;
    border-radius:8px;
}

#verificationID{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#198754;
    margin:15px 0;
    word-break:break-word;
}

#verificationLink{
    background:white;
}

#qrcode{
    width:220px;
    min-height:220px;
    margin:20px auto;
    padding:10px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
}

#record{
    background:#f5f5f5;
    padding:15px;
    white-space:pre-wrap;
    word-break:break-word;
}

.success{
    color:#198754;
    font-weight:bold;
    text-align:center;
}

.error{
    color:#dc3545;
    font-weight:bold;
    text-align:center;
    margin-top:15px;
}

.loading{
    color:#0b5ed7;
    font-weight:bold;
    text-align:center;
    margin-top:15px;
}

/* LOGIN */

#loginScreen{
    position:fixed;
    inset:0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.loginBox{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    text-align:center;
}

.loginBox h2{
    color:#0b5ed7;
}

.loginBox input{
    width:100%;
    padding:13px;
    font-size:17px;
    margin-top:10px;
}

.loginBox button{
    margin-top:15px;
}

#loginError{
    color:#dc3545;
    font-weight:bold;
}

.amount-preview{
    margin-top:10px;
    padding:10px;
    background:#fff8e1;
    border:1px solid #ffc107;
    border-radius:5px;
    color:#795548;
    font-weight:bold;
}

@media(max-width:600px){

    .container{
        margin:15px;
        padding:20px;
    }

    h1{
        font-size:27px;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     PASSWORD LOGIN
================================================== -->

<div id="loginScreen">

    <div class="loginBox">

        <h2>
            🔐 PATEL ASSOCIATES
        </h2>

        <h3>
            Admin Login
        </h3>

        <p>
            Verification Generator खोलने के लिए Password डालें
        </p>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
            onkeydown="if(event.key==='Enter') checkPassword()"
        >

        <button onclick="checkPassword()">
            🔓 Login
        </button>

        <p id="loginError"></p>

    </div>

</div>



<!-- ==================================================
     MAIN CONTAINER
================================================== -->

<div class="container">

    <h1>
        PATEL ASSOCIATES
    </h1>

    <h2>
        Verification ID Generator
    </h2>


    <!-- OWNER NAME -->

    <label>
        Owner Name
    </label>

    <input
        type="text"
        id="ownerName"
        placeholder="Enter Owner Name"
    >


    <!-- OWNER ADDRESS -->

    <label>
        Owner Address
    </label>

    <input
        type="text"
        id="ownerAddress"
        placeholder="Enter Owner Address"
    >


    <!-- REPORT TYPE -->

    <label>
        Report Type
    </label>

    <select
        id="reportType"
        onchange="toggleEstimateAmount()"
    >

        <option value="">
            Select Report Type
        </option>

        <option value="Floor Plan">
            Floor Plan
        </option>

        <option value="Estimate">
            Estimate
        </option>

        <option value="Location Map">
            Location Map
        </option>

        <option value="Key Plan">
            Key Plan
        </option>

        <option value="Report">
            Report
        </option>

    </select>


    <!-- ==================================================
         TOTAL ESTIMATE AMOUNT
    ================================================== -->

    <div id="estimateAmountBox">

        <label>
            Total Estimate Amount
        </label>

        <input
            type="number"
            id="totalEstimateAmount"
            placeholder="Enter Total Estimate Amount"
            min="0"
            step="0.01"
            oninput="showAmountPreview()"
        >

        <div class="amount-note">
            केवल Estimate report के लिए Total Estimate Amount भरें।
        </div>

        <div
            id="amountPreview"
            class="amount-preview"
            style="display:none;"
        ></div>

    </div>


    <!-- ISSUE DATE -->

    <label>
        Issue Date
    </label>

    <input
        type="date"
        id="issueDate"
    >


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- GENERATE BUTTON -->

    <button onclick="generateID()">

        🔐 Generate Verification ID

    </button>


    <!-- ==================================================
         GENERATED RESULT
    ================================================== -->

    <div id="generated">

        <h3 class="success">

            ✅ Verification ID Generated

        </h3>


        <h3>
            Verification ID
        </h3>

        <div id="verificationID"></div>


        <button onclick="copyID()">

            📋 Copy Verification ID

        </button>


        <h3>
            🔗 Verification Link
        </h3>

        <input
            type="text"
            id="verificationLink"
            readonly
        >


        <button onclick="copyLink()">

            📋 Copy Verification Link

        </button>


        <h3 style="text-align:center">

            📱 QR Code

        </h3>


        <div id="qrcode"></div>


        <button onclick="downloadQR()">

            ⬇️ Download QR Code

        </button>


        <h3>
            📄 Complete Record
        </h3>


        <pre id="record"></pre>


        <button onclick="copyRecord()">

            📋 Copy Record

        </button>

    </div>

</div>



<script>


/* ==================================================
   GOOGLE APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbylNwNTKUAY9MyAoZSFaq5BbLbR6lpbthwy9TO-mXhUkmgRGVaPYdCCznmzsXVzrDGf/exec";


/* ==================================================
   ADMIN PASSWORD
================================================== */

const ADMIN_PASSWORD =
"Anil@1234123455";


/* ==================================================
   LOGIN
================================================== */

function checkPassword(){

    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if(
        password ===
        ADMIN_PASSWORD
    ){

        document.getElementById(
            "loginScreen"
        ).style.display =
            "none";


        sessionStorage.setItem(
            "patelAdminLogin",
            "true"
        );

    }

    else{

        document.getElementById(
            "loginError"
        ).innerText =
            "❌ गलत Password";


        document.getElementById(
            "adminPassword"
        ).value = "";

    }

}


/* ==================================================
   REMEMBER LOGIN
================================================== */

window.addEventListener(
    "load",
    function(){

        if(
            sessionStorage.getItem(
                "patelAdminLogin"
            )
            ===
            "true"
        ){

            document.getElementById(
                "loginScreen"
            ).style.display =
                "none";

        }

    }
);


/* ==================================================
   SHOW / HIDE ESTIMATE AMOUNT
================================================== */

function toggleEstimateAmount(){

    const reportType =
        document.getElementById(
            "reportType"
        ).value;


    const box =
        document.getElementById(
            "estimateAmountBox"
        );


    const amount =
        document.getElementById(
            "totalEstimateAmount"
        );


    if(
        reportType === "Estimate"
    ){

        box.style.display =
            "block";

    }

    else{

        box.style.display =
            "none";


        amount.value = "";


        document.getElementById(
            "amountPreview"
        ).style.display =
            "none";

    }

}


/* ==================================================
   AMOUNT PREVIEW
================================================== */

function showAmountPreview(){

    const value =
        document.getElementById(
            "totalEstimateAmount"
        ).value;


    const preview =
        document.getElementById(
            "amountPreview"
        );


    if(
        value &&
        Number(value) >= 0
    ){

        preview.innerText =
            "Total Estimate Amount: ₹" +
            Number(value).toLocaleString(
                "en-IN"
            );


        preview.style.display =
            "block";

    }

    else{

        preview.style.display =
            "none";

    }

}


/* ==================================================
   GENERATE ID
================================================== */

async function generateID(){


    const ownerName =
        document.getElementById(
            "ownerName"
        ).value.trim();


    const ownerAddress =
        document.getElementById(
            "ownerAddress"
        ).value.trim();


    const reportType =
        document.getElementById(
            "reportType"
        ).value;


    const issueDate =
        document.getElementById(
            "issueDate"
        ).value;


    const amountInput =
        document.getElementById(
            "totalEstimateAmount"
        ).value;


    /* ==========================================
       BASIC VALIDATION
    ========================================== */

    if(
        !ownerName ||
        !ownerAddress ||
        !reportType ||
        !issueDate
    ){

        alert(
            "कृपया सभी आवश्यक जानकारी भरें।"
        );

        return;

    }


    /* ==========================================
       ESTIMATE AMOUNT VALIDATION
    ========================================== */

    if(
        reportType === "Estimate"
        &&
        (
            amountInput === ""
            ||
            Number(amountInput) < 0
        )
    ){

        alert(
            "कृपया Total Estimate Amount भरें।"
        );

        document.getElementById(
            "totalEstimateAmount"
        ).focus();

        return;

    }


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        '<div class="loading">🔄 Verification ID generate और Google Sheet में save की जा रही है...</div>';


    document.getElementById(
        "generated"
    ).style.display =
        "none";


    /* ==========================================
       RANDOM CHARACTERS
    ========================================== */

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let firstPart = "";

    let secondPart = "";


    for(
        let i = 0;
        i < 4;
        i++
    ){

        firstPart +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }


    for(
        let i = 0;
        i < 4;
        i++
    ){

        secondPart +=
            characters.charAt(
                Math.floor(
                    Math.random() *
                    characters.length
                )
            );

    }


    const finalID =
        "PA-" +
        firstPart +
        "-" +
        secondPart;


    /* ==========================================
       VERIFICATION LINK
    ========================================== */

    const verificationLink =

        window.location.origin +

        window.location.pathname
            .replace(
                "admin.html",
                "verify.html"
            ) +

        "?id=" +

        encodeURIComponent(
            finalID
        );


    /* ==========================================
       TOTAL ESTIMATE AMOUNT
    ========================================== */

    let totalEstimateAmount = "";


    if(
        reportType === "Estimate"
    ){

        totalEstimateAmount =
            Number(
                amountInput
            ).toLocaleString(
                "en-IN"
            );

    }


    /* ==========================================
       RECORD
    ========================================== */

    const record = {

        id:
            finalID,

        ownerName:
            ownerName,

        ownerAddress:
            ownerAddress,

        reportType:
            reportType,

        issueDate:
            issueDate,

        totalEstimateAmount:
            totalEstimateAmount,

        status:
            "VERIFIED"

    };


    /* ==========================================
       SAVE TO GOOGLE SHEET
    ========================================== */

    try{

        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(
                            record
                        )

                }

            );


        const result =
            await response.json();


        console.log(
            "Apps Script Response:",
            result
        );


        /* ======================================
           SAVE FAILED
        ====================================== */

        if(
            !result.success
        ){

            if(
                result.duplicate
            ){

                message.innerHTML =
                    '<div class="error">❌ Duplicate Verification ID मिली। कृपया फिर Generate करें।</div>';

            }

            else{

                message.innerHTML =
                    '<div class="error">❌ Google Sheet में Record Save नहीं हुआ।<br>' +
                    escapeHTML(
                        result.message || ""
                    ) +
                    '</div>';

            }

            return;

        }


        /* ======================================
           SHOW ID
        ====================================== */

        document.getElementById(
            "verificationID"
        ).innerText =
            finalID;


        /* ======================================
           SHOW LINK
        ====================================== */

        document.getElementById(
            "verificationLink"
        ).value =
            verificationLink;


        /* ======================================
           SHOW RECORD
        ====================================== */

        document.getElementById(
            "record"
        ).innerText =

            JSON.stringify(
                result.record || record,
                null,
                2
            );


        /* ======================================
           CLEAR OLD QR
        ====================================== */

        document.getElementById(
            "qrcode"
        ).innerHTML =
            "";


        /* ======================================
           CREATE QR
        ====================================== */

        new QRCode(

            document.getElementById(
                "qrcode"
            ),

            {

                text:
                    verificationLink,

                width:
                    200,

                height:
                    200

            }

        );


        /* ======================================
           SHOW RESULT
        ====================================== */

        document.getElementById(
            "generated"
        ).style.display =
            "block";


        message.innerHTML =
            '<div class="success">✅ Record Google Sheet में successfully save हो गया।</div>';

    }


    catch(error){

        console.error(
            error
        );


        message.innerHTML =
            '<div class="error">❌ Google Apps Script से connection नहीं हो पाया।<br><br>Web App Deployment / URL check करें।</div>';

    }

}


/* ==================================================
   COPY ID
================================================== */

function copyID(){

    const id =
        document.getElementById(
            "verificationID"
        ).innerText;


    navigator.clipboard.writeText(
        id
    );


    alert(
        "Verification ID copied: " +
        id
    );

}


/* ==================================================
   COPY LINK
================================================== */

function copyLink(){

    const link =
        document.getElementById(
            "verificationLink"
        ).value;


    navigator.clipboard.writeText(
        link
    );


    alert(
        "Verification Link copied."
    );

}


/* ==================================================
   COPY RECORD
================================================== */

function copyRecord(){

    const record =
        document.getElementById(
            "record"
        ).innerText;


    navigator.clipboard.writeText(
        record
    );


    alert(
        "Complete Record copied."
    );

}


/* ==================================================
   DOWNLOAD QR
================================================== */

function downloadQR(){

    const qrImage =
        document.querySelector(
            "#qrcode img"
        );


    if(!qrImage){

        alert(
            "पहले Verification ID Generate करें।"
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        qrImage.src;


    link.download =
        "PATEL-ASSOCIATES-" +

        document.getElementById(
            "verificationID"
        ).innerText +

        ".png";


    link.click();

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
