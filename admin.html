<body>

<div class="container">

<h1>PATEL ASSOCIATES</h1>

<h2 style="text-align:center;">
Verification ID Generator
</h2>

<label>Owner Name</label>

<script>


/* ==========================================
   GENERATE VERIFICATION ID
========================================== */

function generateID(){

    let ownerName =
        document.getElementById("ownerName").value.trim();

    let ownerAddress =
        document.getElementById("ownerAddress").value.trim();

    let reportType =
        document.getElementById("reportType").value;

    let issueDate =
        document.getElementById("issueDate").value;


    /* CHECK ALL FIELDS */

    if(
        ownerName === "" ||
        ownerAddress === "" ||
        reportType === "" ||
        issueDate === ""
    ){

        alert("कृपया सभी जानकारी भरें।");

        return;

    }


    /* ==========================================
       CREATE UNIQUE ID
    ========================================== */

    let year =
        new Date().getFullYear();


    let characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let randomID = "";


    for(let i = 0; i < 4; i++){

        randomID += characters.charAt(

            Math.floor(
                Math.random() * characters.length
            )

        );

    }


    /*
       Example:

       PA-2026-A7K9
    */

    let finalID =
        "PA-" + year + "-" + randomID;


    /* ==========================================
       CREATE VERIFICATION LINK
    ========================================== */

    let verificationLink =
        window.location.origin +
        window.location.pathname
            .replace("admin.html","verify.html") +
        "?id=" +
        encodeURIComponent(finalID);


    /*
       Example:

       https://yourwebsite.com/verify.html?id=PA-2026-A7K9
    */


    /* ==========================================
       CREATE RECORD
    ========================================== */

    let record = {

        id: finalID,

        ownerName: ownerName,

        ownerAddress: ownerAddress,

        reportType: reportType,

        issueDate: issueDate,

        status: "VERIFIED"

    };


    /* ==========================================
       SHOW VERIFICATION ID
    ========================================== */

    document.getElementById(
        "verificationID"
    ).innerText = finalID;


    /* ==========================================
       SHOW VERIFICATION LINK
    ========================================== */

    document.getElementById(
        "verificationLink"
    ).value = verificationLink;


    /* ==========================================
       SHOW COMPLETE RECORD
    ========================================== */

    document.getElementById(
        "record"
    ).innerText =
        JSON.stringify(record, null, 2);


    /* ==========================================
       CLEAR OLD QR CODE
    ========================================== */

    document.getElementById(
        "qrcode"
    ).innerHTML = "";


    /* ==========================================
       CREATE QR CODE
    ========================================== */

    new QRCode(

        document.getElementById("qrcode"),

        {

            text: verificationLink,

            width:200,

            height:200

        }

    );


    /* ==========================================
       SHOW RESULT BOX
    ========================================== */

    document.getElementById(
        "generated"
    ).style.display = "block";


}


/* ==========================================
   COPY VERIFICATION ID
========================================== */

function copyID(){

    let id =
        document.getElementById(
            "verificationID"
        ).innerText;


    navigator.clipboard.writeText(id);


    alert(
        "Verification ID copied: " + id
    );

}


/* ==========================================
   COPY VERIFICATION LINK
========================================== */

function copyLink(){

    let link =
        document.getElementById(
            "verificationLink"
        ).value;


    navigator.clipboard.writeText(link);


    alert(
        "Verification Link copied."
    );

}


/* ==========================================
   COPY COMPLETE RECORD
========================================== */

function copyRecord(){

    let record =
        document.getElementById(
            "record"
        ).innerText;


    navigator.clipboard.writeText(record);


    alert(
        "Complete record copied."
    );

}


/* ==========================================
   DOWNLOAD QR CODE
========================================== */

function downloadQR(){

    let qrImage =
        document.querySelector(
            "#qrcode img"
        );


    if(!qrImage){

        alert(
            "पहले Verification ID Generate करें।"
        );

        return;

    }


    let downloadLink =
        document.createElement("a");


    downloadLink.href =
        qrImage.src;


    downloadLink.download =
        "PATEL-ASSOCIATES-" +
        document.getElementById(
            "verificationID"
        ).innerText +
        ".png";


    downloadLink.click();

}

</script>

</body>
