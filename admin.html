<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Online Verification Portal</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.container{
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0b5ed7;
    margin:5px 0;
}

h2{
    text-align:center;
    color:#333;
    margin-top:5px;
}

.logo{
    text-align:center;
    margin-bottom:10px;
}

.logo img{
    max-width:180px;
    max-height:100px;
    object-fit:contain;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    margin-top:7px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    font-size:17px;
    background:#0b5ed7;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#generated{
    display:none;
    margin-top:25px;
    padding:20px;
    background:#e8f5e9;
    border:1px solid #28a745;
    border-radius:8px;
}

.success{
    color:#198754;
    font-weight:bold;
    text-align:center;
}

.error{
    color:#dc3545;
    font-weight:bold;
    text-align:center;
    margin-top:15px;
}

.loading{
    color:#0b5ed7;
    font-weight:bold;
    text-align:center;
    margin-top:15px;
}

#verificationID{
    font-size:24px;
    font-weight:bold;
    color:#198754;
    text-align:center;
    margin:15px 0;
    word-break:break-word;
}

#verificationLink{
    background:#fff;
}

#qrcode{
    width:220px;
    min-height:220px;
    margin:20px auto;
    background:white;
    padding:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:6px;
}

#record{
    background:#f5f5f5;
    padding:15px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow:auto;
    border-radius:5px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#777;
    font-size:13px;
}


/* PASSWORD */

#loginScreen{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.loginBox{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.2);
    text-align:center;
}

.loginBox h2{
    color:#0b5ed7;
}

.loginBox input{
    margin-top:15px;
}

.loginBox button{
    margin-top:15px;
}

#loginError{
    color:#dc3545;
    font-weight:bold;
}


/* MOBILE */

@media(max-width:600px){

    .container{
        margin:15px;
        padding:20px;
    }

    h1{
        font-size:27px;
    }

    #verificationID{
        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- ==============================
     PASSWORD SCREEN
============================== -->

<div id="loginScreen">

<div class="loginBox">

<h2>🔐 PATEL ASSOCIATES</h2>

<h3>Admin Login</h3>

<p>
Online Verification Portal
</p>

<input
type="password"
id="adminPassword"
placeholder="Enter Password"
onkeydown="if(event.key==='Enter') checkPassword()"
>

<button onclick="checkPassword()">
🔓 Login
</button>

<p id="loginError"></p>

</div>

</div>



<!-- ==============================
     MAIN PAGE
============================== -->

<div class="container">


<div class="logo">

<img
src="Patel_Associates.png"
alt="PATEL ASSOCIATES"
onerror="this.style.display='none';"
>

</div>


<h1>
PATEL ASSOCIATES
</h1>

<h2>
Online Verification Portal
</h2>


<!-- OWNER -->

<label>
Owner Name
</label>

<input
type="text"
id="ownerName"
placeholder="Enter Owner Name"
>


<!-- ADDRESS -->

<label>
Owner Address
</label>

<input
type="text"
id="ownerAddress"
placeholder="Enter Owner Address"
>


<!-- REPORT -->

<label>
Report Type
</label>

<select id="reportType">

<option value="">
Select Report Type
</option>

<option value="Floor Plan">
Floor Plan
</option>

<option value="Estimate">
Estimate
</option>

<option value="Location Map">
Location Map
</option>

<option value="Key Plan">
Key Plan
</option>

<option value="Report">
Report
</option>

</select>


<!-- DATE -->

<label>
Issue Date
</label>

<input
type="date"
id="issueDate"
>


<!-- MESSAGE -->

<div id="message"></div>


<!-- GENERATE -->

<button
id="generateButton"
onclick="generateID()"
>

🔐 Generate & Save Verification ID

</button>



<!-- RESULT -->

<div id="generated">


<h3 class="success">

✅ DOCUMENT SAVED SUCCESSFULLY

</h3>


<h3>
Verification ID
</h3>


<div id="verificationID"></div>


<button onclick="copyID()">
📋 Copy Verification ID
</button>


<h3>
🔗 Verification Link
</h3>


<input
type="text"
id="verificationLink"
readonly
>


<button onclick="copyLink()">
📋 Copy Verification Link
</button>


<h3 style="text-align:center;">
📱 QR Code
</h3>


<div id="qrcode"></div>


<button onclick="downloadQR()">
⬇️ Download QR Code
</button>


<h3>
📄 Complete Record
</h3>


<pre id="record"></pre>


<button onclick="copyRecord()">
📋 Copy Record
</button>


</div>


<div class="footer">

PATEL ASSOCIATES<br>

Online Document Verification System

</div>


</div>



<script>


/* ==================================================
   GOOGLE APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbylNwNTKUAY9MyAoZSFaq5BbLbR6lpbthwy9TO-mXhUkmgRGVaPYdCCznmzsXVzrDGf/exec";


/* ==================================================
   ADMIN PASSWORD
================================================== */

const ADMIN_PASSWORD =
"Anil@1234123455";


/* ==================================================
   LOGIN
================================================== */

function checkPassword(){

    const password =
    document.getElementById(
        "adminPassword"
    ).value;

    if(password === ADMIN_PASSWORD){

        document.getElementById(
            "loginScreen"
        ).style.display="none";

        sessionStorage.setItem(
            "patelAdminLogin",
            "true"
        );

    }

    else{

        document.getElementById(
            "loginError"
        ).innerText =
        "❌ गलत Password";

        document.getElementById(
            "adminPassword"
        ).value="";

    }

}


/* ==================================================
   CHECK LOGIN
================================================== */

window.addEventListener(
"load",
function(){

    if(
        sessionStorage.getItem(
            "patelAdminLogin"
        ) === "true"
    ){

        document.getElementById(
            "loginScreen"
        ).style.display="none";

    }

});



/* ==================================================
   GENERATE RANDOM ID
================================================== */

function createRandomID(){

    const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let part1="";
    let part2="";

    for(let i=0;i<4;i++){

        part1 +=
        characters.charAt(
            Math.floor(
                Math.random() *
                characters.length
            )
        );

    }

    for(let i=0;i<4;i++){

        part2 +=
        characters.charAt(
            Math.floor(
                Math.random() *
                characters.length
            )
        );

    }

    return "PA-" + part1 + "-" + part2;

}



/* ==================================================
   GENERATE ID
================================================== */

async function generateID(){


    const ownerName =
    document.getElementById(
        "ownerName"
    ).value.trim();


    const ownerAddress =
    document.getElementById(
        "ownerAddress"
    ).value.trim();


    const reportType =
    document.getElementById(
        "reportType"
    ).value;


    const issueDate =
    document.getElementById(
        "issueDate"
    ).value;


    /* CHECK */

    if(
        !ownerName ||
        !ownerAddress ||
        !reportType ||
        !issueDate
    ){

        alert(
        "कृपया सभी जानकारी भरें।"
        );

        return;

    }


    const button =
    document.getElementById(
        "generateButton"
    );


    const message =
    document.getElementById(
        "message"
    );


    button.disabled=true;


    message.innerHTML =
    '<div class="loading">🔄 Verification ID बनाई और Google Sheet में save की जा रही है...</div>';


    document.getElementById(
        "generated"
    ).style.display="none";


    /* ==========================================
       CREATE ID
    ========================================== */

    const finalID =
    createRandomID();


    /* ==========================================
       CREATE RECORD
    ========================================== */

    const record={

        id:finalID,

        ownerName:ownerName,

        ownerAddress:ownerAddress,

        reportType:reportType,

        issueDate:issueDate,

        status:"VERIFIED"

    };


    /* ==========================================
       SEND TO GOOGLE APPS SCRIPT
    ========================================== */

    try{


        const response =
        await fetch(
            API_URL,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                JSON.stringify(record)

            }
        );


        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }


        const result =
        await response.json();


        console.log(
            "Google Apps Script:",
            result
        );


        /* ======================================
           DUPLICATE
        ====================================== */

        if(result.duplicate){

            message.innerHTML =
            '<div class="error">❌ Duplicate ID मिली। कृपया फिर से Generate करें।</div>';

            button.disabled=false;

            return;

        }


        /* ======================================
           SAVE FAILED
        ====================================== */

        if(!result.success){

            throw new Error(
                result.message ||
                "Google Sheet में save नहीं हुआ"
            );

        }


        /* ======================================
           VERIFICATION LINK
        ====================================== */

        const verificationPath =
        window.location.pathname
        .replace(
            "admin.html",
            "verify.html"
        );


        const verificationLink =
        window.location.origin +
        verificationPath +
        "?id=" +
        encodeURIComponent(
            finalID
        );


        /* ======================================
           SHOW ID
        ====================================== */

        document.getElementById(
            "verificationID"
        ).innerText =
        finalID;


        /* ======================================
           SHOW LINK
        ====================================== */

        document.getElementById(
            "verificationLink"
        ).value =
        verificationLink;


        /* ======================================
           SHOW RECORD
        ====================================== */

        document.getElementById(
            "record"
        ).innerText =
        JSON.stringify(
            result.record || record,
            null,
            2
        );


        /* ======================================
           QR
        ====================================== */

        document.getElementById(
            "qrcode"
        ).innerHTML="";


        new QRCode(

            document.getElementById(
                "qrcode"
            ),

            {

                text:
                verificationLink,

                width:200,

                height:200

            }

        );


        /* ======================================
           SHOW RESULT
        ====================================== */

        document.getElementById(
            "generated"
        ).style.display="block";


        message.innerHTML =
        '<div class="success">✅ Record Google Sheet में सफलतापूर्वक Save हो गया।</div>';


        /* CLEAR FORM */

        document.getElementById(
            "ownerName"
        ).value="";

        document.getElementById(
            "ownerAddress"
        ).value="";

        document.getElementById(
            "reportType"
        ).value="";

        document.getElementById(
            "issueDate"
        ).value="";


    }

    catch(error){

        console.error(error);


        message.innerHTML =
        '<div class="error">❌ Google Sheet में Record Save नहीं हो पाया।<br><br>' +
        escapeHTML(error.message) +
        '<br><br>Apps Script Deployment और Web App URL check करें।</div>';

    }


    button.disabled=false;

}



/* ==================================================
   COPY ID
================================================== */

function copyID(){

    const id =
    document.getElementById(
        "verificationID"
    ).innerText;

    navigator.clipboard.writeText(id);

    alert(
        "Verification ID copied."
    );

}


/* ==================================================
   COPY LINK
================================================== */

function copyLink(){

    const link =
    document.getElementById(
        "verificationLink"
    ).value;

    navigator.clipboard.writeText(link);

    alert(
        "Verification Link copied."
    );

}


/* ==================================================
   COPY RECORD
================================================== */

function copyRecord(){

    const record =
    document.getElementById(
        "record"
    ).innerText;

    navigator.clipboard.writeText(record);

    alert(
        "Complete Record copied."
    );

}


/* ==================================================
   DOWNLOAD QR
================================================== */

function downloadQR(){

    const qrImage =
    document.querySelector(
        "#qrcode img"
    );


    if(!qrImage){

        alert(
            "पहले Verification ID Generate करें।"
        );

        return;

    }


    const link =
    document.createElement("a");


    link.href =
    qrImage.src;


    link.download =
    "PATEL-ASSOCIATES-" +
    document.getElementById(
        "verificationID"
    ).innerText +
    ".png";


    link.click();

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value){

    return String(value)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>


</body>

</html>
