<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Secure Verification Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

}

.container{

    max-width:600px;

    margin:30px auto;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    color:#0b5ed7;

}

h2{

    text-align:center;

}

label{

    display:block;

    margin-top:18px;

    font-weight:bold;

}

input,
select{

    width:100%;

    padding:13px;

    margin-top:7px;

    font-size:16px;

    border:1px solid #ccc;

    border-radius:5px;

}

button{

    width:100%;

    padding:14px;

    margin-top:20px;

    font-size:17px;

    background:#0b5ed7;

    color:white;

    border:none;

    border-radius:6px;

    cursor:pointer;

}

button:hover{

    background:#084298;

}

#generated{

    display:none;

    margin-top:25px;

    padding:20px;

    background:#e8f5e9;

    border:1px solid #28a745;

    border-radius:8px;

}

#verificationID{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    color:#198754;

    margin:15px 0;

    word-break:break-word;

}

#verificationLink{

    background:white;

}

#qrcode{

    width:220px;

    min-height:220px;

    margin:20px auto;

    padding:10px;

    background:white;

    display:flex;

    justify-content:center;

    align-items:center;

}

#record{

    background:#f5f5f5;

    padding:15px;

    white-space:pre-wrap;

    word-break:break-word;

    overflow:auto;

}

.success{

    color:#198754;

    font-weight:bold;

    text-align:center;

}

.error{

    color:#dc3545;

    font-weight:bold;

    text-align:center;

    margin-top:15px;

}

.loading{

    color:#0b5ed7;

    font-weight:bold;

    text-align:center;

    margin-top:15px;

}

.amountBox{

    display:none;

}

.amountNote{

    font-size:13px;

    color:#666;

    margin-top:5px;

}


/* ==========================================
   LOGIN
========================================== */

#loginScreen{

    position:fixed;

    inset:0;

    background:#f5f5f5;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:99999;

}

.loginBox{

    width:90%;

    max-width:400px;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 20px rgba(0,0,0,.2);

    text-align:center;

}

.loginBox h2{

    color:#0b5ed7;

}

.loginBox input{

    width:100%;

    padding:13px;

    font-size:17px;

    margin-top:10px;

}

.loginBox button{

    margin-top:15px;

}

#loginError{

    color:#dc3545;

    font-weight:bold;

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){

    .container{

        margin:15px;

        padding:20px;

    }

    h1{

        font-size:27px;

    }

    #verificationID{

        font-size:21px;

    }

}

</style>

</head>


<body>


<!-- ==================================================
     LOGIN SCREEN
================================================== -->

<div id="loginScreen">

    <div class="loginBox">

        <h2>
            🔐 PATEL ASSOCIATES
        </h2>

        <h3>
            Secure Admin Login
        </h3>

        <p>
            Verification Generator खोलने के लिए Password डालें
        </p>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
            onkeydown="if(event.key==='Enter') login()"
        >

        <button onclick="login()">

            🔓 Secure Login

        </button>

        <p id="loginError"></p>

    </div>

</div>


<!-- ==================================================
     MAIN
================================================== -->

<div class="container">


<h1>
PATEL ASSOCIATES
</h1>


<h2>
Verification ID Generator
</h2>


<!-- OWNER NAME -->

<label>
Owner Name
</label>

<input
    type="text"
    id="ownerName"
    placeholder="Enter Owner Name"
>


<!-- OWNER ADDRESS -->

<label>
Owner Address
</label>

<input
    type="text"
    id="ownerAddress"
    placeholder="Enter Owner Address"
>


<!-- REPORT TYPE -->

<label>
Report Type
</label>

<select
    id="reportType"
    onchange="reportTypeChanged()"
>

    <option value="">
        Select Report Type
    </option>

    <option value="Floor Plan">
        Floor Plan
    </option>

    <option value="Estimate">
        Estimate
    </option>

    <option value="Location Map">
        Location Map
    </option>

    <option value="Key Plan">
        Key Plan
    </option>

    <option value="Report">
        Report
    </option>

</select>


<!-- ==================================================
     ESTIMATE AMOUNT
================================================== -->

<div
    id="amountBox"
    class="amountBox"
>

    <label>
        Total Estimate Amount
    </label>

    <input
        type="number"
        id="totalEstimateAmount"
        placeholder="Enter Total Estimate Amount"
        min="0"
        step="0.01"
    >

    <div class="amountNote">

        केवल Estimate के लिए यह amount भरें।

    </div>

</div>


<!-- ISSUE DATE -->

<label>
Issue Date
</label>

<input
    type="date"
    id="issueDate"
>


<!-- MESSAGE -->

<div id="message"></div>


<!-- GENERATE -->

<button onclick="generateID()">

    🔐 Generate Verification ID

</button>


<!-- ==================================================
     GENERATED
================================================== -->

<div id="generated">


    <h3 class="success">

        ✅ Verification ID Generated

    </h3>


    <h3>
        Verification ID
    </h3>


    <div id="verificationID"></div>


    <button onclick="copyID()">

        📋 Copy Verification ID

    </button>


    <h3>
        🔗 Verification Link
    </h3>


    <input
        type="text"
        id="verificationLink"
        readonly
    >


    <button onclick="copyLink()">

        📋 Copy Verification Link

    </button>


    <h3 style="text-align:center">

        📱 QR Code

    </h3>


    <div id="qrcode"></div>


    <button onclick="downloadQR()">

        ⬇️ Download QR Code

    </button>


    <h3>
        📄 Complete Record
    </h3>


    <pre id="record"></pre>


    <button onclick="copyRecord()">

        📋 Copy Record

    </button>


</div>


</div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT WEB APP URL

   केवल Web App URL
   Library URL नहीं
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbylNwNTKUAY9MyAoZSFaq5BbLbR6lpbthwy9TO-mXhUkmgRGVaPYdCCznmzsXVzrDGf/exec";


/* ==================================================
   LOGIN TOKEN
================================================== */

let ADMIN_TOKEN =
    sessionStorage.getItem(
        "PATEL_ADMIN_TOKEN"
    ) || "";


/* ==================================================
   LOGIN
================================================== */

async function login(){

    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    const error =
        document.getElementById(
            "loginError"
        );


    if(!password){

        error.innerText =
            "❌ Password डालें।";

        return;

    }


    error.innerText =
        "🔄 Server से password verify हो रहा है...";


    try{


        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "login",

                            password:
                                password

                        })

                }

            );


        const result =
            await response.json();


        if(
            result.success &&
            result.token
        ){

            ADMIN_TOKEN =
                result.token;


            sessionStorage.setItem(
                "PATEL_ADMIN_TOKEN",
                ADMIN_TOKEN
            );


            document.getElementById(
                "loginScreen"
            ).style.display =
                "none";


            error.innerText =
                "";

        }

        else{

            error.innerText =
                "❌ गलत Password";

            document.getElementById(
                "adminPassword"
            ).value =
                "";

        }


    }

    catch(error){

        console.error(
            error
        );


        error.innerText =
            "❌ Google Apps Script से connection नहीं हो पाया।";

    }

}


/* ==================================================
   REPORT TYPE CHANGE
================================================== */

function reportTypeChanged(){

    const reportType =
        document.getElementById(
            "reportType"
        ).value;


    const amountBox =
        document.getElementById(
            "amountBox"
        );


    const amountInput =
        document.getElementById(
            "totalEstimateAmount"
        );


    if(
        reportType ===
        "Estimate"
    ){

        amountBox.style.display =
            "block";

    }

    else{

        amountBox.style.display =
            "none";

        amountInput.value =
            "";

    }

}


/* ==================================================
   GENERATE ID
================================================== */

async function generateID(){


    /* ==========================================
       TOKEN CHECK
    ========================================== */

    if(!ADMIN_TOKEN){

        alert(
            "पहले Admin Login करें।"
        );

        document.getElementById(
            "loginScreen"
        ).style.display =
            "flex";

        return;

    }


    /* ==========================================
       FORM DATA
    ========================================== */

    const ownerName =
        document.getElementById(
            "ownerName"
        ).value.trim();


    const ownerAddress =
        document.getElementById(
            "ownerAddress"
        ).value.trim();


    const reportType =
        document.getElementById(
            "reportType"
        ).value;


    const issueDate =
        document.getElementById(
            "issueDate"
        ).value;


    const totalEstimateAmount =
        document.getElementById(
            "totalEstimateAmount"
        ).value.trim();


    /* ==========================================
       VALIDATION
    ========================================== */

    if(
        !ownerName ||
        !ownerAddress ||
        !reportType ||
        !issueDate
    ){

        alert(
            "कृपया सभी जानकारी भरें।"
        );

        return;

    }


    if(
        reportType ===
        "Estimate" &&
        !totalEstimateAmount
    ){

        alert(
            "कृपया Total Estimate Amount भरें।"
        );

        return;

    }


    /* ==========================================
       MESSAGE
    ========================================== */

    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        '<div class="loading">🔄 Verification ID generate करके Google Sheet में save की जा रही है...</div>';


    document.getElementById(
        "generated"
    ).style.display =
        "none";


    /* ==========================================
       RANDOM ID
    ========================================== */

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";


    let part1 = "";

    let part2 = "";


    for(
        let i = 0;
        i < 4;
        i++
    ){

        part1 +=
            characters.charAt(

                Math.floor(
                    Math.random() *
                    characters.length
                )

            );

    }


    for(
        let i = 0;
        i < 4;
        i++
    ){

        part2 +=
            characters.charAt(

                Math.floor(
                    Math.random() *
                    characters.length
                )

            );

    }


    const finalID =
        "PA-" +
        part1 +
        "-" +
        part2;


    /* ==========================================
       VERIFICATION LINK
    ========================================== */

    const verificationLink =

        window.location.origin +

        window.location.pathname
            .replace(
                "admin.html",
                "verify.html"
            ) +

        "?id=" +

        encodeURIComponent(
            finalID
        ) +

        "&type=" +

        encodeURIComponent(
            reportType
        );


    /* ==========================================
       RECORD
    ========================================== */

    const record = {

        id:
            finalID,

        ownerName:
            ownerName,

        ownerAddress:
            ownerAddress,

        reportType:
            reportType,

        issueDate:
            issueDate,

        totalEstimateAmount:

            reportType ===
            "Estimate"

                ? totalEstimateAmount

                : "",

        status:
            "VERIFIED"

    };


    /* ==========================================
       SAVE
    ========================================== */

    try{


        const response =
            await fetch(

                API_URL,

                {

                    method:
                        "POST",

                    headers:{

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "save",

                            token:
                                ADMIN_TOKEN,

                            ...record

                        })

                }

            );


        const result =
            await response.json();


        console.log(
            "Server response:",
            result
        );


        /* ======================================
           LOGIN EXPIRED
        ====================================== */

        if(
            result.unauthorized
        ){

            sessionStorage.removeItem(
                "PATEL_ADMIN_TOKEN"
            );


            ADMIN_TOKEN =
                "";


            document.getElementById(
                "loginScreen"
            ).style.display =
                "flex";


            message.innerHTML =
                '<div class="error">❌ Login session समाप्त हो गया। कृपया फिर से Login करें।</div>';


            return;

        }


        /* ======================================
           SAVE ERROR
        ====================================== */

        if(
            !result.success
        ){

            message.innerHTML =

                '<div class="error">' +

                '❌ Google Sheet में Record Save नहीं हुआ।' +

                '<br><br>' +

                escapeHTML(
                    result.message ||
                    "Unknown error"
                ) +

                '</div>';

            return;

        }


        /* ======================================
           SHOW ID
        ====================================== */

        document.getElementById(
            "verificationID"
        ).innerText =
            finalID;


        /* ======================================
           SHOW LINK
        ====================================== */

        document.getElementById(
            "verificationLink"
        ).value =
            verificationLink;


        /* ======================================
           SHOW RECORD
        ====================================== */

        document.getElementById(
            "record"
        ).innerText =

            JSON.stringify(
                result.record ||
                record,
                null,
                2
            );


        /* ======================================
           CLEAR OLD QR
        ====================================== */

        document.getElementById(
            "qrcode"
        ).innerHTML =
            "";


        /* ======================================
           CREATE QR
        ====================================== */

        new QRCode(

            document.getElementById(
                "qrcode"
            ),

            {

                text:
                    verificationLink,

                width:
                    200,

                height:
                    200

            }

        );


        /* ======================================
           SHOW RESULT
        ====================================== */

        document.getElementById(
            "generated"
        ).style.display =
            "block";


        message.innerHTML =

            '<div class="success">✅ Record Google Sheet में successfully save हो गया।</div>';


    }

    catch(error){

        console.error(
            error
        );


        message.innerHTML =

            '<div class="error">' +

            '❌ Google Apps Script से connection नहीं हो पाया।' +

            '<br><br>' +

            escapeHTML(
                error.message ||
                error
            ) +

            '</div>';

    }

}


/* ==================================================
   COPY ID
================================================== */

function copyID(){

    const id =
        document.getElementById(
            "verificationID"
        ).innerText;


    navigator.clipboard.writeText(
        id
    );


    alert(
        "Verification ID copied."
    );

}


/* ==================================================
   COPY LINK
================================================== */

function copyLink(){

    const link =
        document.getElementById(
            "verificationLink"
        ).value;


    navigator.clipboard.writeText(
        link
    );


    alert(
        "Verification Link copied."
    );

}


/* ==================================================
   COPY RECORD
================================================== */

function copyRecord(){

    const record =
        document.getElementById(
            "record"
        ).innerText;


    navigator.clipboard.writeText(
        record
    );


    alert(
        "Complete Record copied."
    );

}


/* ==================================================
   DOWNLOAD QR
================================================== */

function downloadQR(){

    const qrImage =
        document.querySelector(
            "#qrcode img"
        );


    if(!qrImage){

        alert(
            "पहले Verification ID Generate करें।"
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        qrImage.src;


    link.download =

        "PATEL-ASSOCIATES-" +

        document.getElementById(
            "verificationID"
        ).innerText +

        ".png";


    link.click();

}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
