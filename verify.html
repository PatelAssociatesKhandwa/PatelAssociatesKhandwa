<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Verification</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

}

.container{

    max-width:600px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.15);

}

/* =========================
   LOGO
========================= */

.logo{

    display:block;

    width:140px;

    height:auto;

    max-height:140px;

    object-fit:contain;

    margin:0 auto 15px auto;

}

/* =========================
   HEADINGS
========================= */

h1{

    text-align:center;

    color:#0b5ed7;

    margin-bottom:5px;

}

h2{

    text-align:center;

    margin-top:5px;

    color:#333;

}

.loading{

    text-align:center;

    padding:25px;

    font-size:18px;

}

.verified{

    background:#d1e7dd;

    color:#0f5132;

    border:1px solid #198754;

    padding:18px;

    border-radius:8px;

    text-align:center;

    font-size:24px;

    font-weight:bold;

}

.notverified{

    background:#f8d7da;

    color:#842029;

    border:1px solid #dc3545;

    padding:18px;

    border-radius:8px;

    text-align:center;

    font-size:22px;

    font-weight:bold;

}

.id{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    color:#198754;

    margin:20px 0;

}

.record{

    margin-top:20px;

    border:1px solid #ddd;

    border-radius:8px;

    overflow:hidden;

}

.row{

    padding:15px;

    border-bottom:1px solid #ddd;

}

.row:last-child{

    border-bottom:none;

}

.label{

    font-weight:bold;

    color:#555;

    margin-bottom:6px;

}

.value{

    font-size:17px;

    color:#111;

    word-break:break-word;

}

.footer{

    text-align:center;

    margin-top:25px;

    color:#777;

    font-size:13px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{

        margin:15px;

        padding:20px;

    }

    .logo{

        width:120px;

        max-height:120px;

    }

    h1{

        font-size:27px;

    }

    h2{

        font-size:20px;

    }

    .verified{

        font-size:22px;

    }

    .id{

        font-size:22px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     PATEL ASSOCIATES LOGO
========================= -->

<img
    src="./Patel_Associates.png"
    alt="PATEL ASSOCIATES Logo"
    class="logo"
>


<h1>
PATEL ASSOCIATES
Er. Anil Patel
</h1>


<h2>
Online Verification Portal
</h2>


<div id="loading" class="loading">

🔄 Verification record खोजा जा रहा है...

</div>


<div id="result"></div>


<div class="footer">

PATEL ASSOCIATES<br>

Online Document Verification System

</div>


</div>



<script>


/* ==================================================
   URL से Verification ID प्राप्त करें
================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const verificationID =
    urlParams.get("id");


/* ==================================================
   ID नहीं मिली
================================================== */

if(!verificationID){

    showError(
        "Verification ID नहीं मिली।"
    );

}


/* ==================================================
   DATA.JSON LOAD करें
================================================== */

else{

    fetch(
        "data.json?time=" +
        Date.now()
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "data.json load नहीं हुई।"
            );

        }

        return response.json();

    })

    .then(function(data){

        findRecord(data);

    })

    .catch(function(error){

        console.error(error);

        showError(
            "data.json load नहीं हो सकी।"
        );

    });

}


/* ==================================================
   RECORD FIND करें
================================================== */

function findRecord(data){

    if(!Array.isArray(data)){

        showError(
            "data.json का format गलत है।"
        );

        return;

    }


    const record =
        data.find(function(item){

            return String(item.id).trim()
                === String(verificationID).trim();

        });


    /* ==================================================
       RECORD नहीं मिला
    ================================================== */

    if(!record){

        showError(
            "यह Verification ID data.json में नहीं मिली।"
        );

        return;

    }


    /* ==================================================
       RECORD मिल गया
    ================================================== */

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).innerHTML = `


        <div class="verified">

            ✓ VERIFIED

        </div>


        <div class="id">

            ${escapeHTML(record.id)}

        </div>


        <div class="record">


            <div class="row">

                <div class="label">
                    Owner Name
                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerName
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Owner Address
                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerAddress
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Report Type
                </div>

                <div class="value">

                    ${escapeHTML(
                        record.reportType
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Issue Date
                </div>

                <div class="value">

                    ${escapeHTML(
                        record.issueDate
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">
                    Status
                </div>

                <div class="value">

                    ✓ ${escapeHTML(
                        record.status
                    )}

                </div>

            </div>


        </div>

    `;

}


/* ==================================================
   ERROR MESSAGE
================================================== */

function showError(message){

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).innerHTML = `


        <div class="notverified">

            ✕ NOT VERIFIED

            <div style="
                font-size:15px;
                margin-top:12px;
                font-weight:normal;
                line-height:1.5;
            ">

                ${escapeHTML(message)}

            </div>

        </div>

    `;

}


/* ==================================================
   SECURITY FUNCTION
================================================== */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
