<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Online Verification Portal</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

}

.container{

    max-width:600px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:12px;

    box-shadow:0 0 15px rgba(0,0,0,.15);

}

.logo{

    text-align:center;

    margin-bottom:10px;

}

.logo img{

    max-width:180px;

    max-height:100px;

    object-fit:contain;

}

h1{

    text-align:center;

    color:#0b5ed7;

    margin:5px 0;

}

h2{

    text-align:center;

    margin-top:5px;

    color:#333;

}

.loading{

    text-align:center;

    padding:25px;

    font-size:18px;

    color:#0b5ed7;

}

.verified{

    background:#d1e7dd;

    color:#0f5132;

    border:1px solid #198754;

    padding:18px;

    border-radius:8px;

    text-align:center;

    font-size:24px;

    font-weight:bold;

}

.notverified{

    background:#f8d7da;

    color:#842029;

    border:1px solid #dc3545;

    padding:18px;

    border-radius:8px;

    text-align:center;

    font-size:22px;

    font-weight:bold;

}

.id{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    color:#198754;

    margin:20px 0;

    word-break:break-word;

}

.record{

    margin-top:20px;

    border:1px solid #ddd;

    border-radius:8px;

    overflow:hidden;

}

.row{

    padding:15px;

    border-bottom:1px solid #ddd;

}

.row:last-child{

    border-bottom:none;

}

.label{

    font-weight:bold;

    color:#555;

    margin-bottom:6px;

}

.value{

    font-size:17px;

    color:#111;

    word-break:break-word;

}

.footer{

    text-align:center;

    margin-top:25px;

    color:#777;

    font-size:13px;

}

</style>

</head>


<body>


<div class="container">


<!-- LOGO -->

<div class="logo">

    <img
        src="Patel_Associates.jpg"
        alt="PATEL ASSOCIATES"
        onerror="this.style.display='none';"
    >

</div>


<h1>
PATEL ASSOCIATES
</h1>


<h2>
Online Verification Portal
</h2>


<div id="loading" class="loading">

🔄 Verification record खोजा जा रहा है...

</div>


<div id="result"></div>


<div class="footer">

PATEL ASSOCIATES<br>

Online Document Verification System

</div>


</div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbylNwNTKUAY9MyAoZSFaq5BbLbR6lpbthwy9TO-mXhUkmgRGVaPYdCCznmzsXVzrDGf/exec";


/* ==================================================
   GET VERIFICATION ID FROM URL
================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const verificationID =
    urlParams.get("id");


/* ==================================================
   CHECK ID
================================================== */

if(!verificationID){

    showError(
        "Verification ID नहीं मिली।"
    );

}

else{

    loadVerificationRecord();

}


/* ==================================================
   LOAD RECORD
================================================== */

function loadVerificationRecord(){


    const apiURL =
        API_URL +
        "?id=" +
        encodeURIComponent(
            verificationID
        );


    fetch(apiURL)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "API response error"
            );

        }

        return response.json();

    })

    .then(function(data){

        console.log(
            "API Response:",
            data
        );


        if(
            data.success &&
            data.record
        ){

            showRecord(
                data.record
            );

        }

        else{

            showError(
                "यह Verification ID database में नहीं मिली।"
            );

        }

    })

    .catch(function(error){

        console.error(
            error
        );


        showError(
            "Verification data load नहीं हो सकी।"
        );

    });

}


/* ==================================================
   SHOW VERIFIED RECORD
================================================== */

function showRecord(record){


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="verified">

            ✓ DOCUMENT VERIFIED

        </div>


        <div class="id">

            ${escapeHTML(record.id)}

        </div>


        <div class="record">


            <div class="row">

                <div class="label">

                    Owner Name

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerName
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Owner Address

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerAddress
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Report Type

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.reportType
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Issue Date

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.issueDate
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Status

                </div>

                <div class="value">

                    ✓ ${escapeHTML(
                        record.status
                    )}

                </div>

            </div>


        </div>

    `;

}


/* ==================================================
   ERROR
================================================== */

function showError(message){


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="notverified">

            ✕ NOT VERIFIED

            <div style="
                font-size:15px;
                margin-top:12px;
                font-weight:normal;
                line-height:1.5;
            ">

                ${escapeHTML(message)}

            </div>

        </div>

    `;

}


/* ==================================================
   SECURITY
================================================== */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
