<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES - Online Verification Portal</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f5f5f5;

    color:#111;

}


.container{

    max-width:650px;

    margin:35px auto;

    background:white;

    padding:30px;

    border-radius:14px;

    box-shadow:0 0 18px rgba(0,0,0,.15);

}


/* ==========================================
   LOGO
========================================== */

.logo{

    text-align:center;

    margin-bottom:10px;

}


.logo img{

    max-width:190px;

    max-height:110px;

    object-fit:contain;

}


/* ==========================================
   HEADINGS
========================================== */

h1{

    text-align:center;

    color:#0b5ed7;

    margin:5px 0;

}


h2{

    text-align:center;

    color:#333;

    margin-top:8px;

}


/* ==========================================
   LOADING
========================================== */

.loading{

    text-align:center;

    padding:25px;

    font-size:18px;

    color:#0b5ed7;

}


/* ==========================================
   VERIFIED
========================================== */

.verified{

    background:#d1e7dd;

    color:#0f5132;

    border:1px solid #198754;

    padding:18px;

    border-radius:8px;

    text-align:center;

    font-size:24px;

    font-weight:bold;

}


/* ==========================================
   NOT VERIFIED
========================================== */

.notverified{

    background:#f8d7da;

    color:#842029;

    border:1px solid #dc3545;

    padding:22px;

    border-radius:8px;

    text-align:center;

}


.notverified-title{

    font-size:23px;

    font-weight:bold;

    margin-bottom:15px;

}


.notverified-message{

    font-size:17px;

    line-height:1.7;

    font-weight:normal;

}


.call-note{

    margin-top:18px;

    padding:13px;

    background:#fff3cd;

    border:1px solid #ffc107;

    color:#664d03;

    border-radius:7px;

    font-size:16px;

    line-height:1.6;

}


/* ==========================================
   VERIFICATION ID
========================================== */

.id{

    text-align:center;

    font-size:25px;

    font-weight:bold;

    color:#198754;

    margin:20px 0;

    word-break:break-word;

}


/* ==========================================
   RECORD
========================================== */

.record{

    margin-top:20px;

    border:1px solid #ddd;

    border-radius:8px;

    overflow:hidden;

}


.row{

    padding:15px;

    border-bottom:1px solid #ddd;

}


.row:last-child{

    border-bottom:none;

}


.label{

    font-weight:bold;

    color:#555;

    margin-bottom:6px;

}


.value{

    font-size:17px;

    color:#111;

    word-break:break-word;

}


/* ==========================================
   ESTIMATE AMOUNT
========================================== */

.amount{

    font-size:20px;

    font-weight:bold;

    color:#0b5ed7;

}


/* ==========================================
   FOOTER
========================================== */

.footer{

    text-align:center;

    margin-top:25px;

    color:#777;

    font-size:13px;

    line-height:1.6;

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){

    .container{

        margin:15px;

        padding:20px;

    }


    h1{

        font-size:26px;

    }


    h2{

        font-size:20px;

    }


    .verified{

        font-size:21px;

    }


    .id{

        font-size:21px;

    }


    .notverified-title{

        font-size:20px;

    }


    .notverified-message{

        font-size:16px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================
     LOGO
========================================== -->

<div class="logo">

    <img
        src="Patel_Associates.png"
        alt="PATEL ASSOCIATES"
        onerror="this.style.display='none';"
    >

</div>


<!-- ==========================================
     TITLE
========================================== -->

<h1>

PATEL ASSOCIATES

</h1>


<h2>

Online Verification Portal

</h2>


<!-- ==========================================
     LOADING
========================================== -->

<div
    id="loading"
    class="loading"
>

🔄 Verification record खोजा जा रहा है...

</div>


<!-- ==========================================
     RESULT
========================================== -->

<div id="result"></div>


<!-- ==========================================
     FOOTER
========================================== -->

<div class="footer">

PATEL ASSOCIATES<br>

Online Document Verification System

</div>


</div>


<script>


/* ==================================================
   GOOGLE APPS SCRIPT WEB APP URL
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbylNwNTKUAY9MyAoZSFaq5BbLbR6lpbthwy9TO-mXhUkmgRGVaPYdCCznmzsXVzrDGf/exec";


/* ==================================================
   GET URL PARAMETERS
================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


/* ==================================================
   VERIFICATION ID
================================================== */

const verificationID =
    urlParams.get("id");


/* ==================================================
   REPORT TYPE
   New links में ?type=Estimate आदि भेज सकते हैं
================================================== */

const urlReportType =
    urlParams.get("type");


/* ==================================================
   START
================================================== */

if(!verificationID){

    showError(
        urlReportType
            ? getInvalidMessage(urlReportType)
            : "यह Verification ID हमारे database में नहीं मिली है।"
    );

}

else{

    loadVerificationRecord();

}


/* ==================================================
   LOAD RECORD
================================================== */

function loadVerificationRecord(){


    const apiURL =
        API_URL +
        "?id=" +
        encodeURIComponent(
            verificationID
        );


    fetch(apiURL)

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "API response error"
            );

        }

        return response.json();

    })

    .then(function(data){

        console.log(
            "API Response:",
            data
        );


        /* ==========================================
           RECORD FOUND
        ========================================== */

        if(
            data.success &&
            data.record
        ){

            showRecord(
                data.record
            );

        }

        else{

            /*
               IMPORTANT:
               Database में ID नहीं मिली।
               इसलिए URL में type मौजूद हो
               तो उसी type के अनुसार message।
            */

            const reportType =
                urlReportType ||
                "";


            showError(
                getInvalidMessage(
                    reportType
                )
            );

        }

    })

    .catch(function(error){

        console.error(
            error
        );


        showError(

            "Verification data load नहीं हो सकी। कृपया कुछ समय बाद पुनः प्रयास करें।"

        );

    });

}


/* ==================================================
   INVALID DOCUMENT MESSAGE
================================================== */

function getInvalidMessage(reportType){

    let typeText =
        String(
            reportType || ""
        ).trim();


    /*
       अगर report type URL में नहीं है
       तो generic message
    */

    if(!typeText){

        return `

            <div class="notverified-message">

                यह Verification ID हमारे database में नहीं मिली है।

                <br><br>

                यह दस्तावेज़ हमारे द्वारा बनाया गया है या नहीं,
                इसकी पुष्टि के लिए कृपया PATEL ASSOCIATES में
                call करके Verify जरूर कर लें।

            </div>

            <div class="call-note">

                📞 अधिक जानकारी हेतु PATEL ASSOCIATES से
                संपर्क करें।

            </div>

        `;

    }


    /*
       Report type के साथ message
    */

    return `

        <div class="notverified-message">

            यह Verification ID हमारे database में नहीं मिली है।

            <br><br>

            यह <b>${escapeHTML(typeText)}</b>
            हमारे द्वारा नहीं बनाया गया है।

            <br><br>

            कृपया अधिक जानकारी हेतु
            PATEL ASSOCIATES में call करके
            Verify जरूर कर लें।

        </div>

        <div class="call-note">

            📞 कृपया किसी भी महत्वपूर्ण निर्णय से पहले
            PATEL ASSOCIATES से दस्तावेज़ की पुष्टि जरूर करें।

        </div>

    `;

}


/* ==================================================
   SHOW ERROR
================================================== */

function showError(message){


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="notverified">

            <div class="notverified-title">

                ❌ DOCUMENT NOT VERIFIED

            </div>


            ${message}

        </div>

    `;

}


/* ==================================================
   SHOW VERIFIED RECORD
================================================== */

function showRecord(record){


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    let estimateHTML = "";


    /*
       Estimate होने पर amount दिखाएं
    */

    if(
        String(
            record.reportType || ""
        ).toLowerCase()
        ===
        "estimate"
    ){

        if(
            record.totalEstimateAmount !==
            undefined &&
            record.totalEstimateAmount !==
            null &&
            String(
                record.totalEstimateAmount
            ).trim() !== ""
        ){

            estimateHTML = `

                <div class="row">

                    <div class="label">

                        Total Estimate Amount

                    </div>

                    <div class="value amount">

                        ₹ ${formatAmount(
                            record.totalEstimateAmount
                        )}

                    </div>

                </div>

            `;

        }

    }


    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="verified">

            ✓ DOCUMENT VERIFIED

        </div>


        <div class="id">

            ${escapeHTML(record.id)}

        </div>


        <div class="record">


            <div class="row">

                <div class="label">

                    Owner Name

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerName
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Owner Address

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.ownerAddress
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Report Type

                </div>

                <div class="value">

                    ${escapeHTML(
                        record.reportType
                    )}

                </div>

            </div>


            ${estimateHTML}


            <div class="row">

                <div class="label">

                    Issue Date

                </div>

                <div class="value">

                    ${escapeHTML(
                        formatDate(
                            record.issueDate
                        )
                    )}

                </div>

            </div>


            <div class="row">

                <div class="label">

                    Status

                </div>

                <div class="value">

                    ✓ ${escapeHTML(
                        record.status
                    )}

                </div>

            </div>


        </div>

    `;

}


/* ==================================================
   FORMAT AMOUNT
================================================== */

function formatAmount(value){

    const number =
        Number(
            String(value)
                .replace(/,/g,"")
        );


    if(
        isNaN(number)
    ){

        return escapeHTML(
            value
        );

    }


    return number.toLocaleString(
        "en-IN",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}


/* ==================================================
   FORMAT DATE
================================================== */

function formatDate(value){

    if(!value){

        return "";

    }


    /*
       अगर date already readable है
    */

    const text =
        String(value);


    /*
       YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(
            text
        )
    ){

        const parts =
            text.split("-");


        return (
            parts[2] +
            "-" +
            parts[1] +
            "-" +
            parts[0]
        );

    }


    return text;

}


/* ==================================================
   SECURITY - ESCAPE HTML
================================================== */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
