<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATEL ASSOCIATES</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b5ed7;
    color:white;
    padding:25px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
    text-align:center;
}

input{
    width:80%;
    padding:12px;
    font-size:18px;
    margin-top:20px;
    box-sizing:border-box;
}

button{
    padding:12px 30px;
    font-size:18px;
    margin-top:20px;
    background:#0b5ed7;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
}

</style>

</head>


<body>


<header>

<img src="Patel_Associates.png"
     alt="PATEL ASSOCIATES Logo"
     style="width:150px;height:150px;object-fit:contain;">

<h1>PATEL ASSOCIATES</h1>

<h3>Document Verification Portal</h3>

</header>

<h3>Document Verification Portal</h3>

</header>


<div class="container">

<h2>Verify Your Document</h2>

<p>Enter Verification ID</p>


<input
type="text"
id="verificationId"
placeholder="PA-2026-0001"
>


<br>


<button onclick="verifyDocument()">
Verify
</button>


<div
id="result"
style="
margin-top:30px;
display:none;
background:#f8f9fa;
padding:20px;
border-radius:8px;
border:1px solid #ddd;
">
</div>


</div>


<footer>

© 2026 PATEL ASSOCIATES

</footer>


<script>


function verifyDocument(){

    let id = document
        .getElementById("verificationId")
        .value
        .trim()
        .toUpperCase();


    let result = document.getElementById("result");


    if(id === ""){

        result.style.display = "block";

        result.innerHTML = `

        <h2 style="color:red;">
        ⚠️ PLEASE ENTER VERIFICATION ID
        </h2>

        <p>
        Please enter a valid Verification ID.
        </p>

        `;

        return;

    }


    result.style.display = "block";


    result.innerHTML = `

    <h2>🔎 Verifying...</h2>

    <p>Please wait...</p>

    `;


    fetch("data.json?v=" + new Date().getTime())

    .then(response => {

        if(!response.ok){

            throw new Error("Unable to load data.json");

        }

        return response.json();

    })


    .then(data => {


        let documentData = data.find(

            item =>

            item.id.toUpperCase() === id

        );


        if(documentData){


            result.innerHTML = `


            <h2 style="color:green;">
            ✅ DOCUMENT VERIFIED
            </h2>


            <p>
            <b>Verification ID :</b>
            ${documentData.id}
            </p>


            <p>
            <b>Owner Name :</b>
            ${documentData.ownerName}
            </p>


            <p>
            <b>Owner Address :</b>
            ${documentData.ownerAddress}
            </p>


            <p>
            <b>Report Type :</b>
            ${documentData.reportType}
            </p>


            <p>
            <b>Issue Date :</b>
            ${documentData.issueDate}
            </p>


            <p>
            <b>Status :</b>

            <span style="color:green;font-weight:bold;">

            ${documentData.status}

            </span>

            </p>


            `;


        }

        else{


            result.innerHTML = `


            <h2 style="color:red;">
            ❌ INVALID DOCUMENT
            </h2>


            <p>
            This Verification ID was not found.
            </p>


            `;

        }


    })


    .catch(error => {


        result.innerHTML = `


        <h2 style="color:red;">
        ⚠️ ERROR
        </h2>


        <p>
        Unable to load verification data.
        </p>


        `;


        console.error(error);


    });

}


window.onload = function(){


    const urlParams =

        new URLSearchParams(
            window.location.search
        );


    const idFromURL =

        urlParams.get("id");


    if(idFromURL){


        document
            .getElementById("verificationId")
            .value = idFromURL;


        verifyDocument();


    }

};


</script>


</body>

</html>
